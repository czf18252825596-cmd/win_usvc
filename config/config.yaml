DEVICE_ID: 1              #设备ID，用于标示船体，方便在软件上识别，与通信和控制无关联
DEVICE_PORT: 5001         #设备端口，船体的TCP服务端口
DEVICE_SN: "3804402080"   #设备SN，来自船的主板，用于识别主板，重置为“NULL”时，工控机会重新匹配主板
DEVICE_TYPE: "ship_calc"  #设备类型，ship_calc代表为船载工控机

control:
  sail:
    SPEED: 1.800000
    Y: 300.000000
    TOLERANCERADIUS1: 2.000000
    TOLERANCERADIUS2: 2.500000
    LAT: 1.000000
    LON: 1.000000

  back:
    MAXSPEED: 1.000000
    MINSPEED: 0.200000
    LOSDISTANCE: 5.000000
    OBSTACLE_INFLUENCE_DISTANCE: 20.000000
    SAFE_DISTANCE: 2.000000
    REPULSIVE_GAIN: 0.600000
    ATTRACTIVE_GAIN: 2.000000
    SIGMA: 3.500000
    TOLERANCERADIUS: 2.000000
    Y: 300.000000
    LAT: 32.819400
    LON: 119.113885

  path:
    MAXSPEED: 1.000000
    MINSPEED: 0.200000
    LOSDISTANCE: 5.000000
    OBSTACLE_INFLUENCE_DISTANCE: 20.000000
    SAFE_DISTANCE: 2.000000
    REPULSIVE_GAIN: 0.600000
    ATTRACTIVE_GAIN: 2.000000
    SIGMA: 3.500000
    TOLERANCERADIUS: 2.000000
  
sensor:
  lidar:
    X_DISTANCE: 0.500000
    Y_DISTANCE: 0.500000
    Z_DISTANCE: 0.010000
    ClusterTolerance: 0.100000
    MinClusterSize: 2
    MaxClusterSize: 200000
    
ship:
  LISTEN_PORT: 2001   #监听端口，用于监听船主控广播的船体信息

upper:
  BROAD_PORT: 2001    #广播端口，工控机将船体信息广播到该端口

peripheral:
  PORT:  2000   #广播与监听端口，
  SN: "3804402080"

